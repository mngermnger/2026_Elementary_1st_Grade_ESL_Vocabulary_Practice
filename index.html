<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#155eef"><title>小一英文單字點讀練習</title><style>
:root{--blue:#155eef;--blue2:#0b46c5;--sky:#eaf2ff;--ink:#17223b;--muted:#60708f;--line:#cbd8ef;--card:#fff;--orange:#f26b21}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(155deg,#ddecff,#f8fbff 45%,#fff3cf);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}button,select{font:inherit}.shell{width:min(820px,100%);margin:auto;padding:18px 14px 30px}.quick{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}.quick a{white-space:nowrap;text-decoration:none;color:var(--blue2);background:#fff;border:2px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:850}.quick a.active{background:var(--blue);border-color:var(--blue);color:#fff}header{display:flex;gap:12px;align-items:center;margin:4px 0 14px}.logo{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:var(--blue);font-size:29px}h1{font-size:clamp(1.35rem,5vw,2rem);margin:0}.sub{margin:4px 0 0;color:var(--muted)}.lesson-row{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:12px}.lesson-select,.soft{min-height:52px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);padding:0 14px;font-weight:800}.card{background:#fff;border:2px solid #d4e0f3;border-radius:28px;padding:22px 18px;text-align:center;box-shadow:0 18px 46px #244b8520}.number{display:inline-flex;min-width:90px;height:36px;align-items:center;justify-content:center;border-radius:999px;background:var(--sky);color:var(--blue2);font-weight:900}.stage{display:flex;align-items:center;justify-content:center;gap:16px;margin:18px 0 8px}.icon{display:grid;place-items:center;width:clamp(78px,21vw,118px);height:clamp(78px,21vw,118px);border-radius:26px;background:linear-gradient(145deg,#fff7ce,#ffe590);font-size:clamp(2.8rem,11vw,4.8rem);box-shadow:inset 0 0 0 3px #fff}.english{font-size:clamp(2rem,9vw,4.6rem);font-weight:950;line-height:1.05;overflow-wrap:anywhere}.chinese{font-size:clamp(1.35rem,6vw,2.05rem);font-weight:850}.bpmf{font-size:clamp(1rem,4.6vw,1.35rem);color:#445578;margin-top:7px;line-height:1.55}.repeat{color:#d74c16;font-weight:950}.sounds{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.sound{min-height:66px;border:0;border-radius:19px;color:#fff;font-size:1.12rem;font-weight:900}.en{background:linear-gradient(135deg,var(--blue),#367ef5)}.zh{background:linear-gradient(135deg,#ff8b25,var(--orange))}.status{min-height:23px;margin-top:11px;color:var(--muted);font-weight:650}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:12px}.controls button,.view-all{min-height:52px;border:2px solid var(--line);border-radius:16px;background:#fff;font-weight:850}.word-select{width:100%;min-height:51px;margin-top:12px;border:2px solid var(--line);border-radius:15px;background:#fff;padding:0 12px;font-weight:750}.view-all{width:100%;margin-top:12px;color:var(--blue2);cursor:pointer}.all-panel[hidden]{display:none}.extras{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.extras a{text-decoration:none;color:var(--blue2);font-weight:800;background:#fff;border:2px solid var(--line);border-radius:13px;padding:10px 13px}.count{margin-left:auto;color:var(--muted);align-self:center}.all-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px;max-height:430px;overflow:auto}.item{border:1px solid var(--line);border-radius:12px;background:#fff;padding:9px;text-align:left}.item b{color:var(--blue);margin-right:7px}.item small{display:block;color:var(--muted);margin-top:4px}@media(max-width:520px){.lesson-row{grid-template-columns:1fr}.stage{gap:9px}.sounds{gap:8px}.controls{grid-template-columns:1fr 1fr}.controls .random{grid-column:1/-1}.all-list{grid-template-columns:1fr}}
</style></head><body><main class="shell"><nav class="quick" id="quick"></nav><header><div class="logo">📘</div><div><h1 id="title">小一英文單字點讀</h1><p class="sub">選擇課程和號碼，再按喇叭聽發音</p></div></header><section class="lesson-row"><select class="lesson-select" id="lessonSelect" aria-label="選擇課程"><option value="overall">Overall 總表</option><option value="Lesson 1">Lesson 1</option><option value="Lesson 2">Lesson 2</option><option value="Lesson 3">Lesson 3</option><option value="Lesson 4">Lesson 4</option><option value="Lesson 5">Lesson 5</option></select><button class="soft" id="random">🎲 隨機 Random</button></section><section class="card"><div class="number" id="number"></div><div class="stage"><div class="icon" id="icon"></div><div class="english" id="english"></div></div><div class="chinese" id="chinese"></div><div class="bpmf" id="bpmf"></div><div class="sounds"><button class="sound en" id="speakEn">🔊 英文</button><button class="sound zh" id="speakZh">🔊 中文</button></div><div class="status" id="status">點一下按鈕，就會唸給你聽</div></section><select class="word-select" id="wordSelect" aria-label="選擇單字"></select><div class="controls"><button id="prev">← 上一個</button><button id="next">下一個 →</button><button class="random" id="random2">🎲 隨機 Random</button></div><button class="view-all" id="viewAll" type="button" aria-expanded="false">查看所有 View all</button><section class="all-panel" id="allPanel" hidden><div class="all-list" id="allList"></div></section><div class="extras"><a href="print/lesson1-cards.html">🖨️ Lesson 1 A4 字卡</a><a href="print/lesson2-cards.html">🖨️ Lesson 2 A4 字卡</a><a href="print/lesson3-cards.html">🖨️ Lesson 3 A4 字卡</a><a href="print/lesson4-cards.html">🖨️ Lesson 4 A4 字卡</a><a href="print/lesson5-cards.html">🖨️ Lesson 5 A4 字卡</a><span class="count" id="count"></span></div></main><script src="data.js"></script><script>
const lessons=['overall','Lesson 1','Lesson 2','Lesson 3','Lesson 4','Lesson 5'];let mode='overall',list=[],index=0;const $=s=>document.querySelector(s);const sel=$('#lessonSelect'),wordSel=$('#wordSelect');
function slug(m){return m==='overall'?'overall':m.toLowerCase().replace(' ','-')}function setMode(m,push=true){mode=lessons.includes(m)?m:'overall';list=mode==='overall'?VOCAB_DATA:VOCAB_DATA.filter(x=>x.lesson===mode);index=0;sel.value=mode;if(push)history.replaceState(null,'','#'+slug(mode));build();}
function build(){wordSel.innerHTML='';$('#allList').innerHTML='';$('#allPanel').hidden=true;$('#viewAll').textContent='查看所有 View all';$('#viewAll').setAttribute('aria-expanded','false');list.forEach((w,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${w.lesson} · ${w.no} — ${w.en}`;wordSel.appendChild(o);const b=document.createElement('button');b.className='item';b.innerHTML=`<b>${w.no}</b>${w.icon} ${w.en}<small>${w.zh}｜${w.bpmf}${w.repeat?' '+w.repeat:''}</small>`;b.onclick=()=>{index=i;render();scrollTo({top:0,behavior:'smooth'})};$('#allList').appendChild(b)});$('#title').textContent=mode==='overall'?'Overall 英文單字總練習':mode+' 單字點讀';$('#count').textContent=`共 ${list.length} 個單字`;document.querySelectorAll('.quick a').forEach(a=>a.classList.toggle('active',a.dataset.mode===mode));render()}
function render(){const w=list[index];if(!w)return;wordSel.value=index;$('#number').textContent=`${w.lesson} · No. ${w.no}`;$('#icon').textContent=w.icon;$('#english').textContent=w.en;$('#chinese').innerHTML=w.zh+(w.repeat?` <span class="repeat">${w.repeat}</span>`:'');$('#bpmf').textContent=w.bpmf;$('#status').textContent='點一下按鈕，就會唸給你聽'}
function speak(text,lang){if(!('speechSynthesis'in window)){ $('#status').textContent='此瀏覽器無法使用語音，請改用 Chrome 或 Safari。';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=lang==='en-US'?.72:.82;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase()===lang.toLowerCase())||vs.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()))||null;u.onstart=()=>$('#status').textContent=lang==='en-US'?'正在播放英文…':'正在播放中文…';u.onend=()=>$('#status').textContent='播放完成 ✓';u.onerror=()=>$('#status').textContent='沒有成功播放，請再按一次。';speechSynthesis.speak(u)}
const q=$('#quick');[['overall','Overall'],['Lesson 1','Lesson 1'],['Lesson 2','Lesson 2'],['Lesson 3','Lesson 3'],['Lesson 4','Lesson 4'],['Lesson 5','Lesson 5']].forEach(([m,t])=>{const a=document.createElement('a');a.href='#'+slug(m);a.dataset.mode=m;a.textContent=t;a.onclick=e=>{e.preventDefault();setMode(m)};q.appendChild(a)});sel.onchange=()=>setMode(sel.value);wordSel.onchange=()=>{index=+wordSel.value;render()};$('#prev').onclick=()=>{index=(index-1+list.length)%list.length;render()};$('#next').onclick=()=>{index=(index+1)%list.length;render()};function random(){let n=index;while(list.length>1&&n===index)n=Math.floor(Math.random()*list.length);index=n;render()}$('#random').onclick=random;$('#random2').onclick=random;$('#viewAll').onclick=()=>{const p=$('#allPanel'),show=p.hidden;p.hidden=!show;$('#viewAll').textContent=show?'收起 Hide all':'查看所有 View all';$('#viewAll').setAttribute('aria-expanded',String(show))};$('#speakEn').onclick=()=>speak(list[index].en,'en-US');$('#speakZh').onclick=()=>speak(list[index].zh,'zh-TW');window.onhashchange=()=>setMode(lessons.find(x=>slug(x)===location.hash.slice(1))||'overall',false);setMode(lessons.find(x=>slug(x)===location.hash.slice(1))||'overall',false);
</script></body></html>
